research_task:
  description: >
    1. Search for the 3 latest {category} launches in India.
    2. For each, identify: RAM, ROM, Processor, and Camera specs.
    3. Find the current retail price range on e-commerce platforms.
    4. Format all findings into a Markdown table.
  expected_output: >
    A Markdown table with exactly these headers:
    | Smartphone | RAM | ROM | Processor | Camera (Rear) | Price (INR) |
    | :--- | :--- | :--- | :--- | :--- | :--- |
  agent: technical_researcher
  output_file: scratchpad/researcher_notes.md

strategic_analysis_task:
  description: >
    1. Review the data from the research_task.
    2. Compare these 3 products against the {reference_product}.
    3. Perform a SWOT analysis for each compared to the {reference_product}.
    4. Provide 3 actionable recommendations for a brand manager.
    5. Include the source links for the data found.
  expected_output: >
    A market intelligence report strictly following this structure:
    
    ## Market Intelligence Report: Competitive Positioning vs. {reference_product}
    **To:** Brand Management Team
    **From:** Consumer Tech Strategy Consultant
    **Subject:** Strategic Positioning vs. {reference_product} (INR Market)

    ### 1. Executive Summary
    [Brief overview of the benchmark product]

    ### 2. SWOT Analysis Table
    | Smartphone | Strengths | Weaknesses | Opportunities | Threats |
    | :--- | :--- | :--- | :--- | :--- |
    [Fill rows here]

    ### 3. Comparison Summary
    [Bullet points on Performance and Value Gap]

    ### 4. Strategic Recommendations
    [3 detailed recommendations with 'Action' and 'Strategy' sub-points]

    ### 5. Data Sources
    [List of URLs]
  agent: market_strategist
  output_file: output/market_report.md

trend_forecasting_task:
  description: >
    1. Analyze the research data and strategic analysis provided.
    2. Identify current market trends: price movements, feature adoption, buyer preferences.
    3. Research upcoming {category} launches and technology announcements.
    4. Predict 6-12 month market trajectory for the {category} segment.
    5. Identify emerging opportunities and threats based on trend analysis.
  expected_output: >
    A trend forecast report with this structure:
    
    ## Market Trend Forecast: {category} (Next 6-12 Months)
    
    ### 1. Current Market Trends
    - Price momentum and historical trajectory
    - Feature adoption patterns (AI, high refresh rate, etc.)
    - Consumer preference shifts
    - Segment growth rates
    
    ### 2. Upcoming Launches & Announcements
    - Expected new product launches (with timeline)
    - Anticipated technology breakthroughs
    - Strategic brand moves
    
    ### 3. Market Forecast
    - Predicted price movement (6 and 12 months)
    - Technology adoption curve trajectory
    - Expected market consolidation
    - Segment growth forecasts
    
    ### 4. Opportunities & Threats
    - 3 emerging opportunities for brands to capitalize on
    - 3 potential threats to current market share
    - Recommended strategic actions to prepare
  agent: trend_forecaster
  output_file: output/trend_forecast.md
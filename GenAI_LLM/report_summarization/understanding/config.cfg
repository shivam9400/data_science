[paths]
# REQUIRED: The training data file you created (e.g., train_expanded.spacy)
train = "./train.spacy" 

# REQUIRED: The development/validation data file (e.g., the 20% split)
dev = "./dev.spacy"

# OPTIONAL: Path to a pre-trained base model (e.g., "en_core_web_lg") 
# If you leave this blank, training starts from scratch.
# base_model = null 
base_model = "en_core_web_sm"

[system]
# Use PyTorch's memory management if you have a GPU
# gpu_allocator = "pytorch"

# Set seed for reproducibility across runs
seed = 42


[nlp]
# Language code for your project (e.g., "en" for English)
lang = "en"

# Name for your trained pipeline (e.g., the name of your final spaCy model folder)
pipeline = ["tok2vec", "ner"]

# A path to a base model you want to initialize from (usually blank for a new project)
# initialize = <Path to existing model, e.g., 'en_core_web_sm'>


[components]
# This section defines the components in your pipeline.
# We are using a Transformer-based architecture, so we need 'tok2vec' and 'ner'.

[components.tok2vec]
factory = "tok2vec"

[components.ner]
factory = "ner"

[training]
# The core training settings.

# Number of training iterations
max_epochs = 10 
seed = 42
# Dropout rate for regularization (0.0 to 1.0)
dropout = 0.1 

# The optimizer configuration (e.g., Adam, which is common)
[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
eps = 1e-08
L2 = 1e-04 # Weight decay


[training.batcher]
@batchers = "spacy.batch_by_words.v1"
# How many words to process per batch (affects speed and memory)
size = 2000

# [training.batcher.discard_oversize] = false


[pretraining]
# If you have unlabelled data, you can pretrain, but generally not needed for fine-tuning
# pretrain_vectors = null 


[initialize]
# Settings for model initialization, required to set up the NER labels.

# You must provide a list of all custom entity labels you are training for
# Example: "FAILURE_MODE", "MATERIAL_SPEC", "SENSOR_ID", "DURATION"
labels = {"ner": [
    "FAILURE_MODE", 
    "MATERIAL_SPEC",
    "DURATION"]}

# Setting the vectors and vocab:
# [initialize.vectors]
# @vectors = "spacy.FastText.v1" 
# Recommended to use vectors for better generalization
# name = "<Name of your vector package, e.g., en_vectors_web_lg>"